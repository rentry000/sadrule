name: Run_Adblock_Reject_JSON26

on:
  schedule:
    - cron: '* * 9 * *'  # 每小时的第9分钟运行（原cron表达式为每20分钟？注意格式：分 时 日 月 周）
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # -------------------------- 原有基础步骤 --------------------------
    - name: Setup Node.js 20
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Setup Python 3.12.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.12.11'

    - name: Checkout repository
      uses: actions/checkout@v3
    # ----------------------------------------------------------------------

    # -------------------------- 新增：Git LFS 集成步骤 --------------------------
    # 1. 安装 Git LFS（Ubuntu 镜像默认未安装）
    - name: Install Git LFS
      run: |
        sudo apt-get update -y
        sudo apt-get install -y git-lfs

    # 2. 初始化 Git LFS 客户端
    - name: Initialize Git LFS
      run: git lfs install

    # 3. 配置 LFS 跟踪规则（跟踪所有 .srs 文件，并提交 .gitattributes 配置）
    - name: Track .srs Files with Git LFS
      run: |
        git lfs track "*.json"  # 匹配生成的 adblock_reject26.srs 文件
        git add .gitattributes  # 将 LFS 配置写入仓库（必须提交才生效）
    # ----------------------------------------------------------------------

    # -------------------------- 原有依赖与脚本步骤 --------------------------
    - name: Install dependencies and sing-box
      run: |
        sudo apt-get update
        sudo apt-get install -y wget apt-transport-https software-properties-common
        wget https://github.com/SagerNet/sing-box/releases/download/v1.11.15/sing-box-1.11.15-linux-amd64.tar.gz
        tar -zxvf sing-box-1.11.15-linux-amd64.tar.gz
        sudo apt install -y bash
        sudo apt install -y python3-pip
        pip3 install --upgrade pip
        pip3 install requests
        rm sing-box-1.11.15-linux-amd64.tar.gz

    - name: Run adblock_rule_generator_json26.py
      run: python3 adblock_rule_generator_json26.py

    - name: Convert rule-set
      shell: bash
      run: sing-box-1.11.15-linux-amd64/sing-box rule-set compile --output adblock_reject26.srs adblock_reject26.json
    # ----------------------------------------------------------------------

    # -------------------------- 原有提交与推送步骤（无需修改） --------------------------
    - name: Force Add and Commit Files
      run: |
        git config --global user.name 'github-actions'
        git config --global user.email 'github-actions@github.com'
        git add -f adblock_reject26.json
        git add -f adblock_reject26.srs  # LFS 会自动处理大文件（-f 可保留，防止缓存问题）
        git commit -m 'Update adblock_reject26.srs' || true  # 允许空提交

    - name: Retry Push Changes
      env:
        TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        for i in {1..5}; do
          git push --force origin HEAD && break || (echo "Push failed, retrying in 10 seconds..." && sleep 10)
        done
